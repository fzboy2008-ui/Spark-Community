  <!-- Paytm Intent & QR Checkout Modal -->
  <div id="checkoutModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      
      <div class="paytm-header">
        <div class="paytm-badge">
          <span>⚡ SPARK VIP CHECKOUT</span>
          <div class="amount-tag">Payable: ₹<span id="mFinalPrice">0</span></div>
        </div>
        <p style="font-size:0.8rem; color:#94a3b8;" id="mPlanName">Selected Plan</p>
      </div>

      <!-- Paytm QR Display -->
      <div style="text-align: center;">
        <div class="qr-frame">
          <img src="qr.jpg" alt="Paytm QR Code" class="qr-image">
        </div>
        <div class="upi-address">UPI ID: <strong>6006283334@ptyes</strong> (Fouzan Tariq)</div>
        
        <!-- Direct App Trigger Button -->
        <a id="paytmDeepLink" href="#" class="upi-app-btn">
          <i class="fa-solid fa-mobile-screen"></i> Open in Paytm / GPay / PhonePe
        </a>
      </div>

      <!-- Staff Referral Code Box (No Client Discount, 10% Staff Profit) -->
      <div style="margin: 12px 0; background: #07090e; padding: 10px; border-radius: 8px; border: 1px solid #1a2333;">
        <label style="font-size: 0.75rem; color:#94a3b8;">Staff Referral / Promoter Code (Optional):</label>
        <div style="display:flex; gap:6px; margin-top:4px;">
          <input type="text" id="couponInput" placeholder="e.g. Sprk-731-petls" style="flex:1; padding:6px; background:#0e121d; border:1px solid #334155; color:#fff; border-radius:4px; font-size:0.8rem;">
          <button type="button" class="btn secondary-btn" style="padding:4px 10px; font-size:0.8rem;" onclick="applyStaffCoupon()">Verify</button>
        </div>
        <p id="couponMsg" style="font-size: 0.75rem; margin-top: 4px;"></p>
      </div>

      <!-- Order Form -->
      <form id="orderCheckoutForm" onsubmit="handleOrderSubmission(event)">
        <div class="form-group">
          <label>Your Name / Discord Tag:</label>
          <input type="text" id="custName" placeholder="e.g., Darequeen / @user" required>
        </div>
        <div class="form-group">
          <label>Your Email (Invoice & Updates):</label>
          <input type="email" id="custEmail" placeholder="yourname@gmail.com" required>
        </div>
        <div class="form-group">
          <label>Bot Requirements / Server Link:</label>
          <textarea id="custDetails" rows="2" placeholder="Bot features details..." required></textarea>
        </div>
        <div class="form-group">
          <label style="color:#00baf2; font-weight:bold;">Enter 12-Digit UPI / UTR Reference No.:</label>
          <input type="text" id="utrCode" placeholder="Enter Transaction UTR after payment" minlength="10" required>
        </div>

        <button type="submit" class="btn primary-btn full-w" style="margin-top:8px;">
          <i class="fa-solid fa-check-circle"></i> Confirm & Submit Order
        </button>
      </form>
    </div>
  </div>
