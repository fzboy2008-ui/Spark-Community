<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — Spark Community</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="nav"><a class="brand" href="index.html"><span class="spark">✦</span> SPARK <b>COMMUNITY</b></a><nav><a href="index.html">Home</a><a href="services.html">Services</a><a href="order.html">Order</a><a class="active" href="status.html">Track Order</a><a class="nav-btn" href="https://discord.gg/h5ejJAabPv" target="_blank">Join Discord</a></nav></header>
<main><section class="page-head"><div class="eyebrow">ORDER TRACKING</div><h1>Where's your order?</h1><p>Enter the Order ID you received after submitting your order.</p></section>
<section class="status-card"><label>Order ID<input id="orderId" placeholder="SPK-2026-XXXXXX"></label><button class="btn primary full" onclick="checkStatus()">Check Status</button><div id="statusResult"></div><p class="muted">Need help? <a class="text-link" href="https://discord.gg/h5ejJAabPv" target="_blank">Open a Discord ticket</a> or email <a class="text-link" href="mailto:fzboy2008@gmail.com">fzboy2008@gmail.com</a>.</p></section></main>
<footer><div><b>✦ SPARK COMMUNITY</b></div><small>© 2026 Spark Community. All rights reserved.</small></footer>
<script>
const BACKEND_URL=""; // Paste Apps Script Web App URL here for live status.
const params=new URLSearchParams(location.search);if(params.get("id"))document.getElementById("orderId").value=params.get("id");
function checkStatus(){
 const id=document.getElementById("orderId").value.trim(), box=document.getElementById("statusResult");
 if(!id){box.innerHTML='<div class="alert">Enter an Order ID.</div>';return;}
 if(!BACKEND_URL){
   const d=JSON.parse(localStorage.getItem("sparkOrder_"+id)||"null");
   if(!d){box.innerHTML='<div class="alert">Live tracking is not connected yet. Use the Order ID in the billing email or contact support.</div>';return;}
   render(d); return;
 }
 const cb="cb_"+Date.now(); window[cb]=d=>{render(d);delete window[cb];script.remove();};
 const script=document.createElement("script");script.src=BACKEND_URL+"?id="+encodeURIComponent(id)+"&callback="+cb;document.body.appendChild(script);
}
function render(d){document.getElementById("statusResult").innerHTML='<div class="status-live"><span class="status-dot"></span><div><b>'+d.status+'</b><small>'+d.service+' · '+d.id+'</small></div></div>';}
</script></body></html>
