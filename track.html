<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Track Order Status | Spark Community</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">⚡ Spark <span>Community</span></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="plans.html">Resources & Plans</a></li>
      <li><a href="track.html" class="active">Track Order</a></li>
      <li><a href="admin.html">Staff Login</a></li>
    </ul>
  </nav>

  <div class="container tracker-container">
    <h1>Track Order Status</h1>
    <p>Apna Order ID enter karke live status check karein:</p>
    <div class="search-box">
      <input type="text" id="trackOrderId" placeholder="e.g., SPK-10928">
      <button class="btn primary-btn" onclick="checkOrderStatus()">Check Status</button>
    </div>

    <div id="orderResult" class="order-result-card" style="display:none;">
      <h3>Order Details: <span id="resOrderId"></span></h3>
      <p><strong>Plan:</strong> <span id="resPlan"></span></p>
      <p><strong>Amount:</strong> ₹<span id="resAmount"></span></p>
      <p><strong>Status:</strong> <span id="resStatus" class="status-badge"></span></p>
      <p class="status-note" id="statusMessage"></p>
      <div id="invoiceAction" style="margin-top:15px; display:none;">
        <button class="btn primary-btn" onclick="downloadInvoice()"><i class="fa-solid fa-download"></i> Download Invoice PDF</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
