<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal | SparkCore</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- 2-Line Header Navbar -->
  <header class="header-wrapper">
    <div class="brand-row">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="SparkCore Logo">
        Spark<span>Core</span>
      </a>
    </div>
    <nav class="nav-row">
      <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Home</a>
      <a href="plans.html" class="nav-btn"><i class="fa-solid fa-layer-group"></i> Plans</a>
      <a href="orders.html" class="nav-btn"><i class="fa-solid fa-receipt"></i> Orders</a>
      <a href="admin.html" class="nav-btn staff-btn active"><i class="fa-solid fa-lock"></i> Staff</a>
    </nav>
  </header>

  <div class="container">
    <div id="loginGate">
      <div class="card" style="max-width:340px; margin:3rem auto; text-align:center;">
        <h3 style="color:#fff; margin-bottom:6px;">⚡ Staff Access</h3>
        <p style="color:#fda4af; font-size:0.8rem; margin-bottom:1rem;">fzboy2008 & dareque3n only</p>
        <form onsubmit="handleStaffEmailLogin(event)">
          <div class="form-group" style="text-align:left;">
            <label>Email:</label>
            <input type="email" id="adminEmailInput" placeholder="fzboy2008@gmail.com" required>
          </div>
          <div class="form-group" style="text-align:left;">
            <label>Password:</label>
            <input type="password" id="adminPassInput" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn primary-btn full-w">Login</button>
        </form>
        <p id="adminErrorMsg" style="color:#ef4444; font-size:0.8rem; margin-top:8px;"></p>
      </div>
    </div>

    <div id="adminPanel" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; border-bottom:1px solid #3c1218; padding-bottom:8px;">
        <div>
          <h2 style="font-size:1.3rem; color:#fff;">Staff Management</h2>
          <small style="color:#fda4af;">Logged in as: <strong id="currentAdminEmail" style="color:#ff2a44;"></strong></small>
        </div>
        <button class="btn secondary-btn" onclick="logoutAdmin()">Logout</button>
      </div>

      <div class="table-responsive">
        <table class="orders-table">
          <thead>
            <tr><th>Order ID</th><th>Customer</th><th>Plan</th><th>UTR</th><th>Amount</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="ordersListTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <footer>
    <p>© SparkCore. All rights reserved.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
